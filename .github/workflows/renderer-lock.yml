name: Resolve companion renderer lock
on:
  pull_request:
    paths: ['.github/workflows/renderer-lock.yml']
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'codex/m1-identity-shell-reviewed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Generate a deterministic lock on a disposable remote runner while the
      # shared local host is capacity-blocked. No lifecycle scripts or commits.
      - run: npm install --package-lock-only --ignore-scripts remark-math@6 rehype-katex@7
      - uses: actions/upload-artifact@v4
        with:
          name: companion-renderer-lock
          path: |
            package.json
            package-lock.json
          retention-days: 1
