name: Review dependency lockfile
on:
  pull_request:
    paths:
      - .github/workflows/review-lockfile.yml
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit fix --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-dependency-lock
          path: package-lock.json
